    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Compatibility shim for browser extensions monkey-patching window.fetch
      try {
        let currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          get: function() {
            return currentFetch;
          },
          set: function(newFetch) {
            currentFetch = newFetch;
          },
          configurable: true,
          enumerable: true
        });
      } catch (err) {
        // Silently continue if property is non-configurable
      }

      // Suppress unhandled extension errors from interfering with the application
      window.addEventListener('error', function(event) {
        if (event.filename && event.filename.startsWith('chrome-extension://')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
